# grove.example.yaml
# Copy this to grove.yaml and edit it. grove reads ./grove.yaml by default,
# or the path in --config or GROVE_CONFIG.

# How often the daemon checks the fleet. The fast tick is liveness only, over
# one docker ps and one supervisor query per host. The full tick adds the
# forge calls, stuck detection and pruning. Install the daemon with
# "grove daemon install".
tick: { fast: 2m, full: 30m }

# How long grove keeps job history, lifecycle events and liveness samples in
# grove.db. Pruned on the full tick. Defaults to 90d.
history: { retention: 90d }

# An optional Prometheus exporter, off unless listen is set. It binds exactly
# what you name here, and doctor warns when that is not loopback: the endpoint
# has no authentication and exposes group names, host names and job counts.
# scrape_cache is how long one gitlab-runner scrape is reused, so two
# Prometheus servers do not double the curl calls landing on your hosts.
metrics: { listen: "127.0.0.1:9130", scrape_cache: 10s }

# Hosts that run runners. The control node itself is type: local. Every other
# host is type: ssh and is addressed by a ~/.ssh/config alias, so jump hosts,
# users and keys keep working the way they already do.
hosts:
  mac:
    type: local
    work_root: /Volumes/ci/grove
  atlas:
    type: ssh
    host: atlas
    work_root: /PROD/local/grove

# Forges grove registers runners against. A credential is never a literal.
# Use ${ENV_VAR}, use command:, or leave auth out to delegate to gh or glab.
forges:
  gh-overload:
    kind: github
    auth: { token: "${GH_TOKEN}" }
  gl-chevro:
    kind: gitlab
    url: https://git.chevro.fr
    auth: { command: "op read op://infra/gitlab/pat" }

# Groups of identical runners. Every group names a forge, a scope, and a
# placement. placement takes { host: <name>, count: <n> } or a { <host>: <n> }
# map that spans hosts.
groups:
  - name: overload-arm
    forge: gh-overload
    scope: { level: organization, target: Overload-coach }
    placement: { host: mac, count: 2 }
    stack: docker
    arch: arm64
    labels: [arm64]              # GitHub speaks labels
    build: ./runners/Dockerfile

  - name: chevro-dind
    forge: gl-chevro
    scope: { level: instance }   # needs an admin personal token
    placement: { atlas: 3 }      # one entity, three managers
    stack: docker
    arch: amd64
    tags: [docker, dind]         # GitLab speaks tags
    image: gitlab/gitlab-runner:latest
    privileged: true             # applies to the job containers
    volumes: ["/cache", "/var/run/docker.sock:/var/run/docker.sock"]
    concurrent: 4
    raw:
      job_image: docker:27       # the image a job gets when it names none
      metrics_port: 9252         # seat n publishes 127.0.0.1:(9252 + n - 1)

  - name: ios
    forge: gh-overload           # native runs on GitHub forges only
    scope: { level: organization, target: Overload-coach }
    placement: { host: mac, count: 1 }
    stack: native                # a process on the host, no container
    labels: [macos, xcode]
    work_root: ~/ci/ios          # this group overrides the host default
    max_job_duration: 90m
    max_work_size: 120G
    raw:
      runner_version: "2.328.0"  # pin it, or leave it out to take the latest
      env:
        DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

  - name: api-repo
    forge: gh-overload
    scope: { level: repository, target: Overload-coach/api }
    placement: { host: mac, count: 1 }
    stack: docker
    labels: [linux, docker]
    drain_timeout: 5m           # how long a runner may finish its job
    pull_policy: missing
    raw:
      docker_run_args: ["--dns", "1.1.1.1"]
      env:
        HTTPS_PROXY: http://proxy.internal:3128
